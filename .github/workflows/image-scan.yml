#uses trivy image scanning to scan the push docker images and find if any CVE's are there or not and we can add this in our pipelines and we can scan our docker images and find if any security vulnerability , CVE's etc
name: Image Scanner
on:
  workflow_call: 
jobs:
  image-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.DOCKERHUB_USER }}/github-action-app:latest
          format: table
          exit-code: "1"  # Set exit code to 1 if vulnerabilities are found
          severity: HIGH,CRITICAL   # Only report HIGH and CRITICAL vulnerabilities
          ignore-unfixed: true  # Ignore vulnerabilities that do not have a fix available
          output: trivy-results.txt

      - name: Show Trivy results
        run: cat trivy-results.txt
      - name: Show Trivy results
        run: |
          echo "========== TRIVY SCAN RESULTS =========="
          cat trivy-results.txt
          echo "========================================"

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.txt    
  